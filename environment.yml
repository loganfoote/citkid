name: citkid
channels:
  - conda-forge
dependencies:
  # Core interpreter (pin first for fast solving)
  - python=3.12

  # ABI-heavy scientific stack
  - numpy=1.26.4
  - scipy=1.16.3
  - numba=0.62.1
  - pyfftw=0.15.1

  # Plotting / UI
  - matplotlib=3.10.8
  - pillow=12.3.0
  - pyqtgraph=0.13.7
  - pyqt=5.15.11

  # Notebook environment
  - jupyterlab=4.5.0
  - tqdm=4.67.1
  - pandas=2.3.3

  # Domain-specific libraries
  - paramiko=4.0.0
  - zarr=3.1.5
  - pyyaml=6.0.3
  - psutil=7.2.2
  - rich=15.0.0

  # Dev/test tools
  - pytest=9.0.1

  # pip installer
  - pip=25.3

  # Editable install (pip section always last)
  - pip:
      - -e .
      - rocket-fft==0.3.1
      - pytest-asyncio==1.4.0
      - pytest-cov==7.1.0
      - rfmux==1.4.1
