# Path to local Git repository
# from which citkid was installed.
CITKID_REPO_PATH: /Users/elijahkane/Documents/GitHub/citkid/

# List of indices of detectors to analyze.
# You can type either a list of ints, e.g. [0,1,2,3,4,5],
# or a string that evaluates to a list or array of ints,
# e.g. np.append(np.arange(20), np.arange(40,50))
DETECTORS_TO_ANALYZE: np.append(np.arange(20), np.arange(40,50))

# Q factor for cutting out resonances during gain+cable delay fitting.
# Must either be a single float, or an array matching 
# the length of DETECTORS_TO_ANALYZE.
GAIN_FIT_Q: 5000

# Whether or not to overwrite existing pipeline outputs.
OVERWRITE: True