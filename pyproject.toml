[build-system]

requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]

name = "citkid"
version = "1.0.0"
description = "Kinetic Inductance Detector data acquisition and analysis"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = ["kinetic inductance detector"]

  authors = [
    {name = "Logan Foote", email = "lfoote@caltech.edu"},
    {name = "Elijah Kane", email = "ekane@caltech.edu"}
  ]

  maintainers = [
    {name = "Logan Foote", email = "lfoote@caltech.edu"},
    {name = "Elijah Kane", email = "ekane@caltech.edu"}
  ]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
  "numpy>=1.26.4",
  "scipy>=1.16.3",
  "numba>=0.62.1",
  # FFTs inside numba-compiled functions (citkid.res.generator)
  "rocket-fft>=0.3.1",
  "pyfftw>=0.15.1",

  # Plotting / UI
  "matplotlib>=3.10.8",
  "pillow>=12.3.0",
  "pyqtgraph>=0.13.7",
  "pyqt5>=5.15.11",

  # Data handling
  "tqdm>=4.67.1",
  "pandas>=2.3.3",
  "zarr>=3.1.5",
  "pyyaml>=6.0.3",
  "psutil>=7.2.2",

  # Instruments (paramiko is used by citkid.primecam)
  "paramiko>=4.0.0",
  "rfmux>=1.4.1",
]

[project.optional-dependencies]
# CNN resonance finder for full VNA sweeps (citkid.vna.res_finder_cnn)
cnn = ["torch>=2.13.0"]
# Running the tests
dev = ["pytest>=9.0.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0"]
# Running the example notebooks
notebooks = ["jupyterlab>=4.5.0"]

[project.urls]
"Homepage" = "https://github.com/loganfoote/citkid"
"Bug Reports" = "https://github.com/loganfoote/citkid/issues"

[tool.setuptools]
package-data = {}
